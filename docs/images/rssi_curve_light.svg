<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="t d">
<title id="t">RSSI pin voltage: RX58_ESP32C5 against two real RX5808 modules</title>
<desc id="d">Medians per 2 dB. The C5 follows the RX5808 curve from the noise floor up, then keeps rising about 8 dB past the point where both RX5808 modules saturate near 1.08 V.</desc>
<rect width="820" height="470" rx="8" fill="#fcfcfb"/>
<text x="64" y="30" font-size="16" font-weight="600" fill="#0b0b0b">RSSI pin voltage vs signal level</text>
<text x="64" y="50" font-size="12.5" fill="#52514e">Receivers side by side, one VTX at 25 mW moved from far to 5 cm; medians per 2 dB</text>
<rect x="558.2" y="70" width="41.2" height="342" fill="#0b0b0b" fill-opacity="0.06"/>
<text x="578.8" y="386" font-size="12" text-anchor="middle" fill="#52514e">C5 headroom</text>
<text x="578.8" y="401" font-size="12" text-anchor="middle" fill="#52514e">≈4 dB</text>
<line x1="64" x2="620" y1="376.0" y2="376.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="380.0" font-size="12" text-anchor="end" fill="#898781" style="font-variant-numeric: tabular-nums">0.4</text>
<line x1="64" x2="620" y1="304.0" y2="304.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="308.0" font-size="12" text-anchor="end" fill="#898781" style="font-variant-numeric: tabular-nums">0.6</text>
<line x1="64" x2="620" y1="232.0" y2="232.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="236.0" font-size="12" text-anchor="end" fill="#898781" style="font-variant-numeric: tabular-nums">0.8</text>
<line x1="64" x2="620" y1="160.0" y2="160.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="164.0" font-size="12" text-anchor="end" fill="#898781" style="font-variant-numeric: tabular-nums">1.0</text>
<line x1="64" x2="620" y1="88.0" y2="88.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="92.0" font-size="12" text-anchor="end" fill="#898781" style="font-variant-numeric: tabular-nums">1.2</text>
<text transform="translate(18 241) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">RSSI pin (V)</text>
<line x1="64" x2="620" y1="412" y2="412" stroke="#c3c2b7" stroke-width="1"/>
<text x="64.0" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0</text>
<text x="167.0" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">10</text>
<text x="269.9" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">20</text>
<text x="372.9" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">30</text>
<text x="475.9" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">40</text>
<text x="578.8" y="430" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">50</text>
<text x="342" y="456" font-size="12" text-anchor="middle" fill="#52514e">Signal level (dB above the C5 noise floor)</text>
<line x1="64" x2="620" y1="130.0" y2="130.0" stroke="#898781" stroke-width="1" stroke-opacity="0.7"/>
<text x="70" y="124.0" font-size="11.5" fill="#898781">RX5808 saturation ≈1.08 V</text>
