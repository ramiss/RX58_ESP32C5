; ESP32_SDR_RX5808 -- drop-in RX5808 replacement on a Seeed XIAO ESP32-C5.
;
; Framework is ESP-IDF, not Arduino: the receiver works at register level
; (MODEM_DIAG I/Q capture, GDMA rings, SPI slave) and the reference
; implementation it draws on (C5VRX) is ESP-IDF 6.x.
;
; The official platformio/espressif32 platform does not support the C5 or
; ESP-IDF 6, so this uses the community pioarduino platform, pinned to an
; exact release (61.04.00-RC1, which ships the seeed_xiao_esp32c5 board).
;
; The framework is overridden to ESP-IDF 6.0.2: the version C5VRX builds
; and is proven on (its CI uses espressif/idf:v6.0.2). The receiver relies
; on undocumented PHY/MAC symbols and register addresses from Espressif's
; closed Wi-Fi libraries, which can change between IDF releases.
;
; Run pio from PowerShell or cmd on Windows: the ESP-IDF tool installer
; refuses to run under MSYS/Git Bash.

[platformio]
default_envs = xiao_c5

[env:xiao_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
platform_packages =
    pioarduino/framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v6.0.2/esp-idf-v6.0.2.tar.xz
framework = espidf
board = seeed_xiao_esp32c5
; The board file says QIO, but the XIAO C5's flash does not boot in QIO
; (ROM: "Invalid image block", then a watchdog loop) -- found by C5VRX.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
; The board file names Arduino's default_8MB.csv; ESP-IDF needs its own.
board_build.partitions = partitions.csv
monitor_speed = 115200
; Opening the port with DTR/RTS asserted triggers the USB Serial/JTAG reset.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
; esptool's DTR/RTS reset wedges the XIAO's USB while our firmware runs
; (README "Flashing"). Uploads instead ask the firmware to reboot into the
; ROM loader, flash with no reset, then start it with a watchdog reset
; (tools/pio_upload.py).
board_upload.before_reset = no-reset
board_upload.after_reset = no-reset
extra_scripts = post:tools/pio_upload.py

; Phase B step 1: IQ loopback pad test (src/padtest.c, README "IQ loopback
; pads"). Build/flash with  .\tools\pio.ps1 run -e padtest -t upload
[env:padtest]
extends = env:xiao_c5
build_flags = -DSDR_PADTEST

; Phase B2: multi-channel hop engine with a USB bench stream (src/hop_bench.c,
; tools/phase_b). Build/flash with  .\tools\pio.ps1 run -e hop -t upload
[env:hop]
extends = env:xiao_c5
build_flags = -DSDR_HOPBENCH

; Phase B3: RX5808 mode without video, RSSI from 10-bit snapshots, PWM on D0
; (src/rx_bench.c, tools/phase_b rx). .\tools\pio.ps1 run -e rx -t upload
[env:rx]
extends = env:xiao_c5
build_flags = -DSDR_RXBENCH
